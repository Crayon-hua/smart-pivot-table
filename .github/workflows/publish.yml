name: Publish npm

on:
  push:
    tags:
      - 'v*'

# Provenance / trusted publishing needs a fresh OIDC token per package.
# Publishing all five in one job makes the 2nd package fail with ENEEDAUTH.
permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/pivot-table/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package version $PKG"
            exit 1
          fi

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        package:
          - '@smartv/pivot-core'
          - '@smartv/pivot-vue'
          - '@smartv/pivot-chart'
          - '@smartv/pivot-univer'
          - '@smartv/pivot-table'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ${{ matrix.package }}... build
      # Do not write a classic NPM_TOKEN into .npmrc. Bypass-2FA tokens are
      # blocked for publishing; they shadow OIDC and cause ENEEDAUTH after the
      # first provenance publish in a job. Each matrix job gets its own OIDC token.
      - name: Publish ${{ matrix.package }}
        run: pnpm --filter ${{ matrix.package }} publish --access public --no-git-checks --provenance --ignore-scripts
