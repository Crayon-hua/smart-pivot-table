name: Publish npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      # Do not set registry-url: setup-node would write
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # pnpm does not expand that placeholder, so publish fails with ENEEDAUTH.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/pivot-table/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package version $PKG"
            exit 1
          fi
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            # pnpm does not interpolate ${NODE_AUTH_TOKEN} in .npmrc; write the value.
            printf '%s\n' "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
            printf '%s\n' "registry=https://registry.npmjs.org/" >> "$HOME/.npmrc"
          else
            echo "NPM_TOKEN is empty; publishing via OIDC trusted publisher"
          fi
          for pkg in \
            @smartv/pivot-core \
            @smartv/pivot-vue \
            @smartv/pivot-chart \
            @smartv/pivot-univer \
            @smartv/pivot-table
          do
            pnpm --filter "$pkg" publish --access public --no-git-checks --provenance
          done
